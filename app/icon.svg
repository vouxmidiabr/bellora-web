<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background -->
  <rect width="100" height="100" fill="#FAF9F7"/>

  <!-- Bell crown/handle -->
  <rect x="43" y="7" width="14" height="11" rx="2" stroke="#1C1A17" stroke-width="3.5"/>

  <!-- Bell body -->
  <path d="M50 18 C33 18 13 33 13 58 L13 68 L87 68 L87 58 C87 33 67 18 50 18 Z"
        stroke="#1C1A17" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Bottom flat line with V-notch clapper -->
  <path d="M13 68 L40 68 L50 79 L60 68 L87 68"
        stroke="#1C1A17" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gold diagonal stripe -->
